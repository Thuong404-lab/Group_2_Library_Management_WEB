<!doctype html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/base}">
<head><title th:text="#{session.history.title}">Login history</title></head>
<body>
<div layout:fragment="content" class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h1 class="h3 mb-1" th:text="#{session.history.heading}">Login history</h1>
            <p class="text-muted mb-0" th:text="#{session.history.description}">Recent security activity.</p>
        </div>
        <a class="btn btn-outline-secondary" th:href="@{/member/sessions}"
           th:text="#{session.active.link}">Active sessions</a>
    </div>
    <div class="alert alert-info" th:if="${history.empty}" th:text="#{session.history.empty}">No activity.</div>
    <div class="table-responsive" th:unless="${history.empty}">
        <table class="table table-striped align-middle">
            <thead><tr>
                <th th:text="#{session.history.time}">Time</th>
                <th th:text="#{session.history.action}">Action</th>
                <th th:text="#{session.history.ip}">IP address</th>
                <th th:text="#{session.history.details}">Details</th>
            </tr></thead>
            <tbody><tr th:each="log : ${history.content}">
                <td th:text="${#temporals.format(log.createdAt, 'dd/MM/yyyy HH:mm:ss')}"></td>
                <td th:text="${log.actionType}"></td>
                <td th:text="${log.ipAddress ?: '-'}"></td>
                <td th:text="${log.description ?: '-'}"></td>
            </tr></tbody>
        </table>
    </div>
    <nav class="d-flex justify-content-between" th:if="${history.totalPages > 1}">
        <a class="btn btn-outline-secondary" th:classappend="${history.first} ? ' disabled'"
           th:href="@{/member/sessions/history(page=${history.number - 1})}" th:text="#{pagination.previous}">Previous</a>
        <span class="align-self-center" th:text="|${history.number + 1} / ${history.totalPages}|"></span>
        <a class="btn btn-outline-secondary" th:classappend="${history.last} ? ' disabled'"
           th:href="@{/member/sessions/history(page=${history.number + 1})}" th:text="#{pagination.next}">Next</a>
    </nav>
</div>
</body>
</html>
